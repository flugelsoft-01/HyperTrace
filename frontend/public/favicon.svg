<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cubeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="100" height="100" rx="24" fill="#090d16"/>
  <rect width="100" height="100" rx="24" fill="url(#cyanGrad)" opacity="0.15"/>
  <rect width="96" height="96" x="2" y="2" rx="22" stroke="rgba(59, 130, 246, 0.4)" stroke-width="2"/>

  <!-- Blockchain Node Icon -->
  <g filter="url(#glow)">
    <!-- Top Face -->
    <polygon points="50,22 76,36 50,50 24,36" fill="url(#cubeGrad)"/>
    <!-- Left Face -->
    <polygon points="24,36 50,50 50,78 24,64" fill="#2563eb"/>
    <!-- Right Face -->
    <polygon points="50,50 76,36 76,64 50,78" fill="#7c3aed"/>
  </g>

  <!-- Cold-Chain Pulse Node -->
  <circle cx="50" cy="50" r="7" fill="#06b6d4" stroke="#ffffff" stroke-width="2"/>
</svg>
